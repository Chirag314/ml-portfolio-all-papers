name: Monorepo CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lenet-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vision/lenet
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
          pip install pytest

      - name: Tests
        run: pytest -q

      - name: Quick training (1 epoch) for artifacts
        run: |
          # temporarily override epochs in config if you want a fast run
          python -m src.train --config configs/default.yaml
